name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 reached end-of-life on 2026-04-30, so it is no longer a
          # supported build runtime. pdfjs-dist 6 also requires >=22.13. Node 24 is
          # Active LTS and is supported until 2028-04-30.
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: TypeScript Typecheck
        run: npm run typecheck

      # Fails on popup/sidepanel drift. The sidepanel is generated from the popup,
      # so a popup-only edit is the exact failure mode this catches.
      - name: Verify Sidepanel Is In Sync
        run: npm run sync:sidepanel:check

      - name: Run Test Suite
        run: npm test

      - name: Build Extension
        run: npm run build

      - name: Verify Built Manifest & Offline Assets
        run: npx vitest run tests/dist-manifest.test.ts tests/offline-assets.test.ts

      # Catches the digests in RELEASE_EVIDENCE.md going stale. Store assets and
      # the tarball are tracked and must match; the zip is gitignored, so it is
      # reported as skipped rather than failing here.
      - name: Verify Release Digests
        run: npm run verify:digests
