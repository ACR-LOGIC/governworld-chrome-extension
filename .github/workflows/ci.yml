name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Test Suite
        run: npm test

      - name: Build Extension
        run: npm run build

      - name: Verify Built Manifest & Offline Assets
        run: npx vitest run tests/dist-manifest.test.ts tests/offline-assets.test.ts
